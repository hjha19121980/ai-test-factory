<section class="planner-view" aria-labelledby="planner-title"><div class="planner-header"><div><p class="eyebrow">PLANNER / REVIEW REQUIRED</p><h2 id="planner-title">Your test plan is ready.</h2><p>Review the strategy before any specialist agent is invoked.</p></div><span class="plan-pill">{{ decision === 'awaiting_approval' ? 'AWAITING APPROVAL' : decision | uppercase }}</span></div><div class="plan-meta"><span>RUN <strong>{{ runId }}</strong></span><span>SOURCE <strong>{{ sourceType | uppercase }}</strong></span><span>TEST LAYERS <strong>{{ testLayerCount || 'AUTO' }}</strong></span></div><label class="plan-field"><span>Planner summary</span><textarea [ngModel]="summary" (ngModelChange)="summaryChange.emit($event)" rows="4"></textarea></label><label class="plan-field"><span>Acceptance and traceability strategy</span><textarea [ngModel]="criteria" (ngModelChange)="criteriaChange.emit($event)" rows="3"></textarea></label><div class="plan-actions"><button class="secondary-button" type="button" (click)="save.emit()">Save changes</button><button class="reject-button" type="button" (click)="reject.emit()" [disabled]="decision !== 'awaiting_approval'">Reject plan</button><button class="submit-button" type="button" (click)="approve.emit()" [disabled]="decision !== 'awaiting_approval'">Approve and generate tests <span aria-hidden="true">-&gt;</span></button></div></section>
