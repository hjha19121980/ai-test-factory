<section class="form-section"><div class="section-heading"><span class="section-number">04</span><div><h2>Connect MCP servers</h2><p>Provide server details, select what the Planner may use, then start them.</p></div></div><div class="mcp-list">@for (server of servers; track server.id) { <div class="mcp-row" [class.selected]="server.selected"><label class="mcp-check"><input type="checkbox" [checked]="server.selected" (change)="toggle(server)" /><span><strong>{{ server.name }}</strong><small>{{ server.description }}</small></span></label><input class="mcp-endpoint" [name]="server.id + 'Endpoint'" [(ngModel)]="server.endpoint" placeholder="MCP endpoint URL" [disabled]="!server.selected" /><span class="mcp-status" [class.started]="server.started">{{ server.started ? 'STARTED' : server.selected ? 'READY TO START' : 'NOT SELECTED' }}</span></div> }</div><button type="button" class="secondary-button" (click)="start()" [disabled]="!selectedServers.length">Start selected MCP servers</button></section>
