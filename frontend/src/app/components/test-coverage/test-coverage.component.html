<section class="form-section"><div class="section-heading"><span class="section-number">03</span><div><h2>Choose test coverage</h2><p>Tell the Planner which test layers matter for this change.</p></div></div><div class="test-type-grid" role="group" aria-label="Requested test types">@for (testType of testTypes; track testType) { <label class="test-type" [class.selected]="selectedTestTypes.has(testType)"><input type="checkbox" [checked]="selectedTestTypes.has(testType)" (change)="toggle(testType)" /><span>{{ testType }}</span></label> }</div>@if (submitted && !selectedTestTypes.size) { <small class="field-error">Choose at least one test type.</small> }</section>
