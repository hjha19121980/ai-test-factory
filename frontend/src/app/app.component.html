<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark"><img src="/cg_logo.png" alt="AI Test Factory logo" /></div>
      <div><span class="brand-kicker">AI TEST</span><strong>Factory</strong></div>
    </div>
    <nav class="nav-list">
      @for (item of navItems; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
          <span class="nav-index">{{ item.index }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-footer"><div class="status-dot"></div><div><span class="footer-label">SYSTEM STATUS</span><span class="footer-value">Ready for intake</span></div></div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
